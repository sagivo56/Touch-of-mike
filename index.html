<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#008000" />
<title>טאץ׳ — סוליטר בנק רוסי</title>
<style>
  /* =========================================================
     TOUCH (Russian Bank) — Classic Win95/XP Solitaire styling
     ========================================================= */
  :root {
    --felt-1: #1f8a3b;
    --felt-2: #0a6b2a;
    --felt-edge: #064d1e;
    /* Fluid defaults — scale with the smaller of viewport width/height so the
       board fits iPhone (incl. SE / Pro Max) and Galaxy screens. JS fitLayout()
       refines these precisely at runtime and on rotation. */
    --card-w: clamp(38px, min(19.5vw, 9.2vh), 66px);
    --card-h: calc(var(--card-w) * 1.4);
    --stack-offset: calc(var(--card-h) * 0.26);
    --win-face: #ece9d8;      /* XP window face */
    --win-blue1: #245edb;     /* XP title gradient */
    --win-blue2: #3f8cf3;
    --btn-face: #ece9d8;
    --hint: #ffe14d;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overscroll-behavior: none;
    font-family: "MS Sans Serif", "Tahoma", "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    background:
      radial-gradient(ellipse at 50% 30%, var(--felt-1), var(--felt-2) 70%, var(--felt-edge) 100%);
    color: #fff;
    display: flex;
    justify-content: center;
    touch-action: manipulation;
  }

  #app {
    width: 100%;
    max-width: 480px;
    min-height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;                 /* zones manage their own scrolling */
    padding: env(safe-area-inset-top) 0 0 0;  /* bottom inset handled by .controls */
  }

  /* ---------- Title bar (XP look) ---------- */
  .titlebar {
    background: linear-gradient(180deg, var(--win-blue2) 0%, var(--win-blue1) 8%, #1b4bc0 100%);
    color: #fff;
    font-weight: bold;
    font-size: 13px;
    padding: 3px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    border-bottom: 1px solid #06308f;
    text-shadow: 1px 1px 0 rgba(0,0,0,.4);
    flex: 0 0 auto;
  }
  .titlebar .ico {
    width: 16px; height: 16px;
    background: #ffd700;
    border: 1px solid #7a5c00;
    border-radius: 2px;
    display: inline-flex; align-items:center; justify-content:center;
    color:#7a0000; font-size:11px; font-weight:bold;
  }
  .titlebar .spacer { flex: 1; }
  .titlebar button {
    font-family: inherit;
    font-size: 11px;
    background: var(--btn-face);
    color: #000;
    border: 2px outset #fff;
    border-radius: 0;
    padding: 1px 8px;
    cursor: pointer;
  }
  .titlebar button:active { border-style: inset; }

  /* ---------- Status strip ---------- */
  .status {
    flex: 0 0 auto;
    background: #d8d4c0;
    color: #000;
    border-bottom: 2px solid #808070;
    padding: 4px 8px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 26px;
  }
  .status .turn-dot {
    width: 12px; height: 12px; border-radius: 50%;
    border: 1px solid #333;
    background: #999;
    flex: 0 0 auto;
  }
  .status .turn-dot.p1 { background: #2f6df0; }
  .status .turn-dot.p2 { background: #d63030; }
  .status .msg { flex: 1; font-weight: bold; }

  /* ---------- Player + center zones ---------- */
  .zone {
    padding: 6px 8px;
    flex: 0 0 auto;
  }
  .zone-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .5px;
    opacity: .9;
    margin-bottom: 3px;
    display: flex;
    align-items: center;
    gap: 6px;
    text-shadow: 1px 1px 0 rgba(0,0,0,.4);
  }
  .zone-label .badge {
    background: rgba(0,0,0,.35);
    border-radius: 8px;
    padding: 0 7px;
    font-size: 11px;
  }
  .zone-label .badge.win { background:#ffd700; color:#5a3d00; }

  .player-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    justify-content: center;
  }
  .pile-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .pile-caption {
    font-size: 10px;
    opacity: .85;
    text-shadow: 1px 1px 0 rgba(0,0,0,.4);
  }

  .center {
    flex: 1 1 auto;
    min-height: 0;                 /* allow the flex child to actually shrink+scroll */
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 6px 8px 10px;
    border-top: 2px solid rgba(0,0,0,.25);
    border-bottom: 2px solid rgba(0,0,0,.25);
    background:
      linear-gradient(180deg, rgba(0,0,0,.06), rgba(0,0,0,0) 40px);
  }
  .center-section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .5px;
    opacity: .85;
    margin: 2px 0 4px;
    text-shadow: 1px 1px 0 rgba(0,0,0,.4);
  }

  /* Traditional Russian Bank table: four vertical columns
     (tableau | foundations | foundations | tableau). */
  .center-legend {
    text-align: center;
    font-size: 11px;
    opacity: .8;
    margin: 0 0 8px;
    text-shadow: 1px 1px 0 rgba(0,0,0,.4);
  }
  .table-layout {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 6px;
  }
  .col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
  }
  .foundation-col {
    /* subtle inset so the middle "foundation" columns read as the core */
    background: rgba(0,0,0,.10);
    border-radius: 6px;
    padding: 4px 3px;
  }

  /* ---------- Slots ---------- */
  .slot {
    width: var(--card-w);
    height: var(--card-h);
    border: 1px dashed rgba(255,255,255,.55);
    border-radius: 5px;
    position: relative;
    flex: 0 0 auto;
    background: rgba(255,255,255,.06);
  }
  .slot.foundation::after {
    content: attr(data-hint);
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: rgba(255,255,255,.35);
    pointer-events: none;
  }
  .tableau-slot {
    /* grows with stacked cards */
    min-height: var(--card-h);
    height: auto;
  }
  .tableau-slot.filled {
    border-color: transparent;      /* hide the empty-slot outline behind cards */
    background: transparent;
  }

  .slot.valid-target {
    border: 2px solid var(--hint);
    box-shadow: 0 0 8px 2px rgba(255,225,77,.7);
    background: rgba(255,225,77,.15);
  }
  .slot.valid-target.foundation::after { color: rgba(255,225,77,.5); }

  /* ---------- Cards ---------- */
  .card {
    width: var(--card-w);
    height: var(--card-h);
    border-radius: 5px;
    background: #fff;
    border: 1px solid #000;
    box-shadow: 0 1px 2px rgba(0,0,0,.4);
    position: relative;
    font-family: "MS Sans Serif", "Tahoma", "Segoe UI", sans-serif;
    cursor: pointer;
    overflow: hidden;
  }
  .card.red { color: #d40000; }
  .card.black { color: #000; }

  .card .corner {
    position: absolute;
    left: 3px;
    top: 1px;
    line-height: 1;
    font-weight: bold;
    text-align: center;
  }
  .card .corner .r { font-size: 13px; display:block; }
  .card .corner .s { font-size: 11px; display:block; margin-top: -1px; }
  .card .corner.br {
    left: auto; top: auto;
    right: 3px; bottom: 1px;
    transform: rotate(180deg);
  }
  .card .pip {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: bold;
  }
  .card .pip.face {
    font-size: 20px;
    letter-spacing: -1px;
  }

  /* face-down / backs */
  .card.back {
    background:
      repeating-linear-gradient(45deg, #123a8f 0 4px, #1e56c9 4px 8px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.15) 0 4px, transparent 4px 8px);
    border: 2px solid #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.4), inset 0 0 0 2px #123a8f;
  }
  .card.back.red-back {
    background:
      repeating-linear-gradient(45deg, #8f1212 0 4px, #c91e1e 4px 8px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.15) 0 4px, transparent 4px 8px);
    box-shadow: 0 1px 2px rgba(0,0,0,.4), inset 0 0 0 2px #8f1212;
  }

  .card.selected {
    outline: 3px solid var(--hint);
    outline-offset: 0;
    box-shadow: 0 0 10px 3px rgba(255,225,77,.85);
    z-index: 50;
  }
  .card.movable::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 4px;
    box-shadow: inset 0 0 0 2px rgba(47,109,240,.0);
  }

  /* pile-in-a-slot (reserve/stock/waste show single card + count) */
  .pilecard { position: relative; }
  .count {
    position: absolute;
    right: -6px;
    top: -6px;
    background: #000;
    color: #fff;
    font-size: 10px;
    border-radius: 9px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #fff;
    z-index: 5;
  }
  .empty-pile {
    width: var(--card-w);
    height: var(--card-h);
    border: 1px dashed rgba(255,255,255,.5);
    border-radius: 5px;
    background: rgba(0,0,0,.12);
  }

  /* tableau stacked cards */
  .tableau-stack .card {
    position: absolute;
    left: 0;
  }

  /* ---------- Controls ---------- */
  .controls {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    padding: 8px 8px max(8px, env(safe-area-inset-bottom));
    justify-content: center;
    background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.18));
  }
  .btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    background: var(--btn-face);
    color: #000;
    border: 2px outset #fff;
    padding: 8px 14px;
    border-radius: 0;
    cursor: pointer;
    min-width: 120px;
  }
  .btn:active { border-style: inset; }
  .btn:disabled { color: #888; cursor: default; }
  .btn.primary {
    background: linear-gradient(180deg, #eef6ff, #cfe2ff);
  }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 16px;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    width: 100%;
    max-width: 340px;
    background: var(--win-face);
    color: #000;
    border: 2px outset #fff;
    box-shadow: 3px 3px 0 rgba(0,0,0,.4);
  }
  .modal .m-title {
    background: linear-gradient(180deg, var(--win-blue2), var(--win-blue1));
    color: #fff;
    font-weight: bold;
    font-size: 13px;
    padding: 4px 8px;
    text-shadow: 1px 1px 0 rgba(0,0,0,.4);
  }
  .modal .m-body {
    padding: 12px;
    font-size: 13px;
    line-height: 1.45;
  }
  .modal .m-body h3 { margin: 8px 0 4px; font-size: 13px; }
  .modal .m-body ul { margin: 4px 0; padding-inline-start: 18px; }
  .modal .m-body li { margin: 2px 0; }
  .modal .m-foot {
    padding: 8px 12px 12px;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .big-result { text-align:center; font-size: 18px; font-weight: bold; margin: 6px 0; }

  /* toast */
  .toast {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.82);
    color: #fff;
    padding: 8px 14px;
    border-radius: 4px;
    font-size: 12px;
    z-index: 150;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
    max-width: 90%;
    text-align: center;
  }
  .toast.show { opacity: 1; }

  /* Short screens: tighten vertical padding so all three zones stay visible.
     Card sizing itself is handled fluidly by the clamp() vars + fitLayout(). */
  @media (max-height: 720px) {
    .zone { padding: 4px 8px; }
    .zone-label { margin-bottom: 2px; }
  }
  @media (max-height: 620px) {
    .zone { padding: 3px 6px; }
    .center-section-label { margin: 1px 0 3px; }
    .btn { padding: 6px 12px; }
  }

  /* Landscape / very short: shrink chrome further */
  @media (max-height: 480px) {
    .titlebar { font-size: 12px; padding: 2px 8px; }
    .status { min-height: 20px; padding: 2px 8px; }
    .zone { padding: 2px 6px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="titlebar">
    <span class="ico">ט</span>
    <span>טאץ׳ — בנק רוסי</span>
    <span class="spacer"></span>
    <button id="musicBtn" title="הפעלה/כיבוי מוזיקה" aria-label="החלפת מצב מוזיקה">&#9834; מוזיקה</button>
    <button id="rulesBtn">חוקים</button>
    <button id="newBtn">חדש</button>
  </div>

  <div class="status">
    <span class="turn-dot" id="turnDot"></span>
    <span class="msg" id="statusMsg">תורך</span>
  </div>

  <!-- Player 2 (opponent / AI) -->
  <div class="zone" id="p2zone">
    <div class="zone-label">
      <span id="p2name">יריב (מחשב)</span>
      <span class="badge" id="p2reserve">רזרבה: 13</span>
    </div>
    <div class="player-row" id="p2row"></div>
  </div>

  <!-- Center shared area — traditional Russian Bank layout:
       foundations in the two middle columns, tableau on the two outer columns. -->
  <div class="center">
    <div class="center-legend">טבלה בצדדים · בסיסים במרכז</div>
    <div class="table-layout">
      <div class="col tableau-col" id="tabLeft"></div>
      <div class="col foundation-col" id="fLeft"></div>
      <div class="col foundation-col" id="fRight"></div>
      <div class="col tableau-col" id="tabRight"></div>
    </div>
  </div>

  <!-- Player 1 (you) -->
  <div class="zone" id="p1zone">
    <div class="zone-label">
      <span id="p1name">שחקן (אתה)</span>
      <span class="badge" id="p1reserve">רזרבה: 13</span>
    </div>
    <div class="player-row" id="p1row"></div>
  </div>

  <div class="controls">
    <button class="btn" id="undoBtn" title="ביטול מהלכים בתור זה">ביטול</button>
    <button class="btn primary" id="endBtn">סיום תור (משיכה)</button>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Rules / result modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <div class="m-title" id="modalTitle">איך משחקים — טאץ׳</div>
      <div class="m-body" id="modalBody"></div>
      <div class="m-foot" id="modalFoot"></div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   TOUCH — Russian Bank, 2-player competitive solitaire
   Two 52-card decks (104). First to empty their 13-card
   Reserve pile wins.
   ============================================================ */

const SUITS = ["S", "H", "D", "C"];               // spades, hearts, diamonds, clubs
const SUIT_CHAR = { S: "♠", H: "♥", D: "♦", C: "♣" };
const RED = { H: true, D: true, S: false, C: false };
const RANK_LABEL = { 1: "A", 11: "J", 12: "Q", 13: "K" };

let uid = 0;
function makeDeck(deckIndex) {
  const cards = [];
  for (const s of SUITS) {
    for (let r = 1; r <= 13; r++) {
      cards.push({ id: ++uid, suit: s, rank: r, color: RED[s] ? "red" : "black", deck: deckIndex });
    }
  }
  return cards;
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function rankLabel(r) { return RANK_LABEL[r] || String(r); }

/* ---------------- Game state ---------------- */
let G = null;               // main game state
let selected = null;        // {kind:'reserve'|'waste'|'tableau', col?}
let history = [];           // undo snapshots within current human turn
let aiBusy = false;

function newGame() {
  // Combine two decks, shuffle, split 52/52.
  const all = shuffle([...makeDeck(0), ...makeDeck(1)]);
  const p1cards = all.slice(0, 52);
  const p2cards = all.slice(52, 104);

  function mkPlayer(cards) {
    return {
      reserve: cards.slice(0, 13),   // top = last element
      stock: cards.slice(13),        // draw from end
      waste: [],
    };
  }

  G = {
    players: [mkPlayer(p1cards), mkPlayer(p2cards)], // 0 = You (bottom), 1 = Computer (top)
    foundations: Array.from({ length: 8 }, () => []),
    tableau: Array.from({ length: 8 }, () => []),
    current: 0,
    over: false,
    winner: null,
  };
  selected = null;
  history = [];
  aiBusy = false;
  render();
  setStatus("תורך — הקש על קלף, ואז הקש לאן להניח אותו.");
}

/* ---------------- Rule helpers ---------------- */

// top card of a pile (or null)
function topOf(pile) { return pile.length ? pile[pile.length - 1] : null; }

// Can card be placed on foundation index fi?
function canFoundation(card, fi) {
  const f = G.foundations[fi];
  if (!card) return false;
  if (f.length === 0) return card.rank === 1;             // only Ace on empty
  const t = f[f.length - 1];
  return card.suit === t.suit && card.rank === t.rank + 1; // same suit, +1
}

// Can card be placed on tableau column ti, given the source kind + player?
function canTableau(card, ti, sourceKind, player) {
  if (!card) return false;
  const col = G.tableau[ti];
  if (col.length === 0) {
    // Empty column: must prioritise filling from Reserve.
    // Only allowed from a NON-reserve source when that player's reserve is empty.
    if (sourceKind !== "reserve" && G.players[player].reserve.length > 0) return false;
    return true; // any card may start an empty column
  }
  const t = col[col.length - 1];
  return card.color !== t.color && card.rank === t.rank - 1; // alt colour, one lower
}

// Resolve the currently selected source into {card, remove()}
function resolveSource(sel, player) {
  if (!sel) return null;
  const p = G.players[player];
  if (sel.kind === "reserve") {
    const c = topOf(p.reserve);
    return c ? { card: c, kind: "reserve", remove: () => p.reserve.pop() } : null;
  }
  if (sel.kind === "waste") {
    const c = topOf(p.waste);
    return c ? { card: c, kind: "waste", remove: () => p.waste.pop() } : null;
  }
  if (sel.kind === "tableau") {
    const col = G.tableau[sel.col];
    const c = topOf(col);
    return c ? { card: c, kind: "tableau", remove: () => col.pop() } : null;
  }
  return null;
}

// List every legal destination for a given source (for highlighting + validation)
function validTargets(src, player) {
  const targets = [];
  if (!src) return targets;
  for (let fi = 0; fi < 8; fi++) if (canFoundation(src.card, fi)) targets.push({ type: "foundation", i: fi });
  for (let ti = 0; ti < 8; ti++) if (canTableau(src.card, ti, src.kind, player)) targets.push({ type: "tableau", i: ti });
  return targets;
}

// Does the current player have ANY legal move available?
function hasAnyMove(player) {
  const sources = [{ kind: "reserve" }, { kind: "waste" }];
  for (let c = 0; c < 8; c++) sources.push({ kind: "tableau", col: c });
  for (const s of sources) {
    const src = resolveSource(s, player);
    if (src && validTargets(src, player).length > 0) return true;
  }
  return false;
}

/* ---------------- Executing moves ---------------- */

function snapshot() {
  return JSON.stringify({
    players: G.players, foundations: G.foundations, tableau: G.tableau,
    current: G.current,
  });
}
function restore(snap) {
  const s = JSON.parse(snap);
  G.players = s.players;
  G.foundations = s.foundations;
  G.tableau = s.tableau;
  G.current = s.current;
}

function doMove(sel, target, player, recordUndo) {
  const src = resolveSource(sel, player);
  if (!src) return false;
  const ok = target.type === "foundation"
    ? canFoundation(src.card, target.i)
    : canTableau(src.card, target.i, src.kind, player);
  if (!ok) return false;

  if (recordUndo) history.push(snapshot());

  const card = src.remove();
  if (target.type === "foundation") G.foundations[target.i].push(card);
  else G.tableau[target.i].push(card);

  // Win check: reserve emptied
  if (G.players[player].reserve.length === 0 && !G.over) {
    G.over = true;
    G.winner = player;
  }
  return true;
}

// Draw a card from stock to waste; ends the player's turn.
// If stock empty, flip waste over to become the new stock (once around).
function drawCard(player) {
  const p = G.players[player];
  if (p.stock.length === 0) {
    if (p.waste.length === 0) return false; // nothing to draw
    p.stock = p.waste.slice().reverse();
    p.waste = [];
  }
  p.waste.push(p.stock.pop());
  return true;
}

/* ---------------- Human interaction ---------------- */

function trySelect(sel) {
  if (G.over || aiBusy || G.current !== 0) return;
  const src = resolveSource(sel, 0);
  if (!src) { flash("אין מה להזיז שם."); return; }
  // toggle off if same
  if (selected && selected.kind === sel.kind && selected.col === sel.col) {
    selected = null; render(); return;
  }
  selected = sel;
  render();
}

function tryPlace(target) {
  if (G.over || aiBusy || G.current !== 0 || !selected) return;
  const moved = doMove(selected, target, 0, true);
  if (moved) {
    selected = null;
    render();
    if (G.over) { endGame(); return; }
    // auto-hint if no moves left
    if (!hasAnyMove(0)) setStatus("אין מהלכים — הקש „סיום תור (משיכה)”.");
    else setStatus("המשך לשחק, או הקש „סיום תור (משיכה)”.");
  } else {
    flash("המהלך הזה לא חוקי כאן.");
  }
}

function endTurn() {
  if (G.over || aiBusy || G.current !== 0) return;
  drawCard(0);
  selected = null;
  history = [];
  G.current = 1;
  render();
  setStatus("המחשב חושב…");
  setTimeout(runAI, 550);
}

function undo() {
  if (G.over || aiBusy || G.current !== 0) return;
  if (history.length === 0) { flash("אין מה לבטל בתור זה."); return; }
  restore(history.pop());
  selected = null;
  render();
}

/* ---------------- AI (Player 2) ---------------- */
/* Greedy with per-turn state de-duplication: it may play any legal move
   (including tableau->tableau to open a column), but it never revisits a
   board state seen earlier in the same turn — which makes infinite loops
   impossible while still letting it maneuver. Priority favours emptying
   its own Reserve and clearing cards onto Foundations. */

function scoredMoves(player) {
  const candidates = [];
  const sources = [{ kind: "reserve" }, { kind: "waste" }];
  for (let c = 0; c < 8; c++) sources.push({ kind: "tableau", col: c });

  for (const sel of sources) {
    const src = resolveSource(sel, player);
    if (!src) continue;
    for (const t of validTargets(src, player)) {
      let s = 0;
      if (t.type === "foundation") s += 100;                 // off the board — best
      if (sel.kind === "reserve") s += 60;                   // emptying reserve = goal
      else if (sel.kind === "waste") s += 12;
      else s += 6;                                           // tableau source
      if (t.type === "tableau" && G.tableau[t.i].length === 0) s += 4; // use empty col
      if (sel.kind === "tableau" && t.type === "tableau") s -= 3;      // mild discourage
      candidates.push({ sel, target: t, score: s });
    }
  }
  candidates.sort((a, b) => b.score - a.score);
  return candidates;
}

// Pick the best move that leads to a state not yet seen this turn.
function pickAIMove(seen) {
  for (const c of scoredMoves(1)) {
    const snap = snapshot();
    doMove(c.sel, c.target, 1, false);
    const h = snapshot();
    restore(snap);
    if (!seen.has(h)) return { sel: c.sel, target: c.target, hash: h };
  }
  return null;
}

function runAI() {
  aiBusy = true;
  const seen = new Set([snapshot()]);
  let steps = 0;

  function step() {
    if (G.over) { aiBusy = false; endGame(); return; }
    const mv = (steps < 80) ? pickAIMove(seen) : null; // safety cap
    if (mv) {
      doMove(mv.sel, mv.target, 1, false);
      seen.add(mv.hash);
      steps++;
      render();
      if (G.over) { aiBusy = false; endGame(); return; }
      setTimeout(step, 420);
    } else {
      // No more useful moves -> draw and end AI turn
      drawCard(1);
      render();
      setTimeout(() => {
        aiBusy = false;
        G.current = 0;
        render();
        if (!hasAnyMove(0)) setStatus("תורך — אין מהלכים? הקש „סיום תור (משיכה)”.");
        else setStatus("תורך — הקש על קלף ואז על היעד.");
      }, 450);
    }
  }
  setTimeout(step, 300);
}

/* ---------------- Rendering ---------------- */

function cardEl(card, faceUp) {
  const el = document.createElement("div");
  if (!faceUp) {
    el.className = "card back" + (card && card.color === "red" ? " red-back" : "");
    return el;
  }
  el.className = "card " + card.color;
  const ch = SUIT_CHAR[card.suit];
  const rl = rankLabel(card.rank);
  const isFace = card.rank > 10 || card.rank === 1;
  el.innerHTML =
    `<div class="corner"><span class="r">${rl}</span><span class="s">${ch}</span></div>` +
    `<div class="pip${isFace ? " face" : ""}">${isFace ? rl + ch : ch}</div>` +
    `<div class="corner br"><span class="r">${rl}</span><span class="s">${ch}</span></div>`;
  return el;
}

// A reserve/stock/waste pile: single visible card + count badge.
function pileGroup(caption, card, faceUp, count, onTap, opts) {
  opts = opts || {};
  const group = document.createElement("div");
  group.className = "pile-group";

  const holder = document.createElement("div");
  holder.className = "pilecard";
  if (card) {
    const c = cardEl(card, faceUp);
    if (opts.selectable) c.classList.add("movable");
    if (opts.selected) c.classList.add("selected");
    holder.appendChild(c);
    if (count > 0) {
      const b = document.createElement("div");
      b.className = "count";
      b.textContent = count;
      holder.appendChild(b);
    }
  } else {
    const e = document.createElement("div");
    e.className = "empty-pile";
    holder.appendChild(e);
  }
  if (onTap) holder.addEventListener("click", onTap);
  group.appendChild(holder);

  const cap = document.createElement("div");
  cap.className = "pile-caption";
  cap.textContent = caption;
  group.appendChild(cap);
  return group;
}

function render() {
  // Status dot + reserve badges
  const dot = document.getElementById("turnDot");
  dot.className = "turn-dot " + (G.current === 0 ? "p1" : "p2");

  const p1r = G.players[0].reserve.length;

  const src = selected ? resolveSource(selected, 0) : null;
  const targets = src ? validTargets(src, 0) : [];
  const isTarget = (type, i) => targets.some(t => t.type === type && t.i === i);

  /* ----- Player 2 (top) ----- */
  const p2row = document.getElementById("p2row");
  p2row.innerHTML = "";
  const P2 = G.players[1];
  p2row.appendChild(pileGroup("רזרבה", topOf(P2.reserve), true, P2.reserve.length, null));
  p2row.appendChild(pileGroup("חפיסה", topOf(P2.stock), false, P2.stock.length, null));
  p2row.appendChild(pileGroup("פסולת", topOf(P2.waste), true, P2.waste.length, null));

  /* ----- Foundations (two middle columns: 0-3 left, 4-7 right) ----- */
  function renderFoundation(i) {
    const f = G.foundations[i];
    const slot = document.createElement("div");
    slot.className = "slot foundation" + (isTarget("foundation", i) ? " valid-target" : "");
    slot.setAttribute("data-hint", "A");
    slot.setAttribute("data-fi", i);
    const t = topOf(f);
    if (t) {
      const c = cardEl(t, true);
      slot.appendChild(c);
      if (f.length > 1) {
        const b = document.createElement("div");
        b.className = "count"; b.textContent = f.length;
        c.appendChild(b);
      }
    }
    slot.addEventListener("click", () => tryPlace({ type: "foundation", i }));
    return slot;
  }

  /* ----- Tableau piles (two outer columns: 0-3 left, 4-7 right) ----- */
  function renderTableau(i) {
    const col = G.tableau[i];
    const slot = document.createElement("div");
    slot.className = "slot tableau-slot"
      + (isTarget("tableau", i) ? " valid-target" : "")
      + (col.length > 0 ? " filled" : "");
    slot.setAttribute("data-ti", i);

    const stack = document.createElement("div");
    stack.className = "tableau-stack";
    stack.style.position = "relative";
    // Adaptive overlap: long piles compress so the top (playable) card stays
    // fully visible while buried cards still show their rank/suit corner.
    const off = columnOffset(col.length);
    const ch = getCardH();
    stack.style.height = (col.length > 0 ? ch + (col.length - 1) * off : ch) + "px";

    col.forEach((card, idx) => {
      const c = cardEl(card, true);
      c.style.top = (idx * off) + "px";
      c.style.zIndex = String(idx + 1);
      if (idx === col.length - 1) {
        c.classList.add("movable");
        if (selected && selected.kind === "tableau" && selected.col === i) c.classList.add("selected");
        c.addEventListener("click", (e) => {
          e.stopPropagation();
          if (selected && isTarget("tableau", i)) { tryPlace({ type: "tableau", i }); return; }
          trySelect({ kind: "tableau", col: i });
        });
      }
      stack.appendChild(c);
    });
    slot.appendChild(stack);
    slot.addEventListener("click", () => tryPlace({ type: "tableau", i }));
    return slot;
  }

  const tabLeft = document.getElementById("tabLeft");
  const tabRight = document.getElementById("tabRight");
  const fLeft = document.getElementById("fLeft");
  const fRight = document.getElementById("fRight");
  tabLeft.innerHTML = ""; tabRight.innerHTML = ""; fLeft.innerHTML = ""; fRight.innerHTML = "";
  for (let i = 0; i < 4; i++) {
    tabLeft.appendChild(renderTableau(i));
    tabRight.appendChild(renderTableau(i + 4));
    fLeft.appendChild(renderFoundation(i));
    fRight.appendChild(renderFoundation(i + 4));
  }

  /* ----- Player 1 (bottom, you) ----- */
  const p1row = document.getElementById("p1row");
  p1row.innerHTML = "";
  const P1 = G.players[0];
  const myTurn = G.current === 0 && !G.over && !aiBusy;
  p1row.appendChild(pileGroup("רזרבה", topOf(P1.reserve), true, P1.reserve.length,
    () => trySelect({ kind: "reserve" }),
    { selectable: myTurn && P1.reserve.length > 0, selected: selected && selected.kind === "reserve" }));
  p1row.appendChild(pileGroup("חפיסה", topOf(P1.stock), false, P1.stock.length, null));
  p1row.appendChild(pileGroup("פסולת", topOf(P1.waste), true, P1.waste.length,
    () => trySelect({ kind: "waste" }),
    { selectable: myTurn && P1.waste.length > 0, selected: selected && selected.kind === "waste" }));

  // Controls
  document.getElementById("endBtn").disabled = !myTurn;
  document.getElementById("undoBtn").disabled = !myTurn || history.length === 0;
}

function getOffset() {
  return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--stack-offset")) || 20;
}
function getCardH() {
  return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--card-h")) || 82;
}

// Overlap offset for a tableau column of length n. Compresses as the column
// grows so a long sequence stays within a sensible height (the top card is
// always fully visible; buried cards keep >= ~13px so their corner shows).
function columnOffset(n) {
  const base = getOffset();
  if (n <= 1) return base;
  const ch = getCardH();
  const budget = 3.2 * ch;                     // preferred max stack height
  const fit = (budget - ch) / (n - 1);
  return Math.max(13, Math.min(base, fit));
}

// Precisely size cards to the live viewport (belt-and-suspenders over the CSS
// clamp) so the board fits any phone — iPhone SE..Pro Max and Galaxy — and
// re-fits on rotation / browser-chrome show-hide.
function fitLayout() {
  const vv = window.visualViewport;
  const vw = Math.min((vv && vv.width) || window.innerWidth, 480);
  const vh = (vv && vv.height) || window.innerHeight;

  // Width budget: 4 columns, center side padding (8*2) + 3 gaps (6).
  const byWidth = (vw - 16 - 3 * 6) / 4;
  // Height budget: the traditional layout stacks 4 rows in the middle plus the
  // two player zones, so keep cards small enough that it mostly fits portrait.
  const byHeight = (vh - 120) / 10;

  let cw = Math.floor(Math.min(byWidth, byHeight));
  cw = Math.max(38, Math.min(cw, 66));
  const chh = Math.round(cw * 1.4);
  const off = Math.round(chh * 0.26);

  const root = document.documentElement.style;
  root.setProperty("--card-w", cw + "px");
  root.setProperty("--card-h", chh + "px");
  root.setProperty("--stack-offset", off + "px");
}

/* ============================================================
   Background music — an original, looping composition in
   D harmonic minor with the raised-7th / augmented-second color
   characteristic of Russian romantic music. Synthesized live with
   the Web Audio API (no audio files, no copyrighted recordings).
   ============================================================ */
const Music = (() => {
  // Vintage 8-bit / chiptune (NES-style): square-wave lead, triangle bass,
  // a fast pulse arpeggio, and a noise channel for drums. Dry, gated envelopes.
  const BPM = 96;
  const beat = 60 / BPM;                 // seconds per quarter note
  const eighth = beat / 2;
  const sixteenth = beat / 4;
  // Lead melody — [midiNote, beats] (0 = rest). D harmonic minor: D E F G A Bb C#.
  const MELODY = [
    [69,1],[69,1],[65,1],[69,1],         // Dm
    [67,1],[70,1],[74,1],[70,1],         // Gm
    [73,2],[69,2],                       // A (raised 7th C#)
    [74,2],[69,1],[65,1],                // Dm
    [65,1],[69,1],[74,1],[73,1],         // Dm -> leading tone
    [74,2],[70,2],                       // Bb
    [70,1],[67,1],[70,1],[74,1],         // Gm
    [73,2],[69,2],                       // A  (aug-2nd Bb->C# color)
  ];
  // Per-bar harmony: {bass root midi, arpeggio chord tones}.
  const BARS = [
    { bass: 38, arp: [62, 65, 69] },     // Dm
    { bass: 43, arp: [67, 70, 74] },     // Gm
    { bass: 45, arp: [69, 73, 76] },     // A  (major dominant)
    { bass: 38, arp: [62, 65, 69] },     // Dm
    { bass: 38, arp: [62, 65, 69] },     // Dm
    { bass: 46, arp: [70, 74, 77] },     // Bb
    { bass: 43, arp: [67, 70, 74] },     // Gm
    { bass: 45, arp: [69, 73, 76] },     // A
  ];
  const loopDur = 32 * beat;             // 8 bars of 4/4

  // 0.05s of silence — looped through an <audio> element on the unlock gesture.
  // On iOS this switches the audio session to "playback", so Web Audio is heard
  // even when the phone's ring/silent switch is set to silent.
  const SILENT_WAV = "data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA";
  let ctx = null, tone = null, drumBus = null, started = false, timer = null, nextLoop = 0;
  let noiseBuf = null, silentEl = null, announced = false;
  let enabled = true;
  try { enabled = localStorage.getItem("touch-music") !== "off"; } catch (e) {}

  const freq = (m) => 440 * Math.pow(2, (m - 69) / 12);

  // A gated tone voice — square (lead/arp) or triangle (bass). Sharp attack,
  // brief sustain, quick release: the classic chip envelope.
  function chip(time, midi, dur, type, peak, dest) {
    if (midi <= 0) return;
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(freq(midi), time);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.linearRampToValueAtTime(peak, time + 0.006);
    g.gain.setValueAtTime(peak, time + Math.max(0.02, dur * 0.55));
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    o.connect(g).connect(dest);
    o.start(time);
    o.stop(time + dur + 0.02);
  }

  // Punchy pitch-dropping kick.
  function kick(time) {
    const o = ctx.createOscillator();
    o.type = "sine";
    o.frequency.setValueAtTime(130, time);
    o.frequency.exponentialRampToValueAtTime(45, time + 0.11);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.linearRampToValueAtTime(0.26, time + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.16);
    o.connect(g).connect(drumBus);
    o.start(time); o.stop(time + 0.18);
  }

  // Filtered noise burst — snare (bandpass) or hi-hat (highpass).
  function noise(time, dur, filterType, hz, peak) {
    const s = ctx.createBufferSource();
    s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter();
    f.type = filterType; f.frequency.value = hz;
    const g = ctx.createGain();
    g.gain.setValueAtTime(peak, time);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    s.connect(f).connect(g).connect(drumBus);
    s.start(time); s.stop(time + dur + 0.02);
  }

  function scheduleLoop(start) {
    // Lead melody (square)
    let t = start;
    for (const [m, b] of MELODY) { chip(t, m, b * beat * 0.9, "square", 0.17, tone); t += b * beat; }

    for (let bar = 0; bar < 8; bar++) {
      const b0 = start + bar * 4 * beat;
      const ch = BARS[bar];
      // Triangle bass — root on each beat, with an octave lift on beat 3 for bounce.
      for (let q = 0; q < 4; q++) {
        chip(b0 + q * beat, ch.bass + (q === 2 ? 12 : 0), beat * 0.85, "triangle", 0.2, tone);
      }
      // Pulse arpeggio — eighth notes cycling the chord tones.
      for (let e = 0; e < 8; e++) {
        chip(b0 + e * eighth, ch.arp[e % ch.arp.length], eighth * 0.7, "square", 0.06, tone);
      }
      // Drums — 16 steps: kick (1 & 3), snare (2 & 4), hats on every 8th.
      for (let s = 0; s < 16; s++) {
        const dt = b0 + s * sixteenth;
        if (s === 0 || s === 8) kick(dt);
        if (s === 4 || s === 12) noise(dt, 0.13, "bandpass", 1800, 0.14);
        if (s % 2 === 0) noise(dt, 0.03, "highpass", 8000, 0.04);
      }
    }
  }

  function tick() {
    if (!ctx) return;
    while (nextLoop < ctx.currentTime + 0.6) { scheduleLoop(nextLoop); nextLoop += loopDur; }
  }

  function init() {
    if (ctx) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      const master = ctx.createGain();
      master.gain.value = 0.42;
      master.connect(ctx.destination);
      // Tonal channels run through a gentle low-pass to tame square-wave harshness
      // while keeping the crunchy 8-bit character.
      tone = ctx.createGain();
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = 5200;
      tone.connect(lp).connect(master);
      // Drums go straight to master (full range).
      drumBus = ctx.createGain();
      drumBus.gain.value = 0.9;
      drumBus.connect(master);
      // One second of white noise, reused for every drum hit.
      const n = Math.floor(ctx.sampleRate);
      noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      return true;
    } catch (e) { ctx = null; return false; }
  }

  const isRunning = () => started && !!ctx && ctx.state === "running";

  // Play a silent looping media element to unlock audio on iOS (see SILENT_WAV).
  function unlockMedia() {
    try {
      if (!silentEl) {
        silentEl = new Audio(SILENT_WAV);
        silentEl.loop = true; silentEl.volume = 0;
        silentEl.setAttribute("playsinline", "");
      }
      const p = silentEl.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  function announce() {
    if (announced) return;
    announced = true;
    try { flash("♫ המוזיקה פועלת"); } catch (e) {} // "♫ המוזיקה פועלת"
  }

  // Idempotent: safe to call on every gesture. Always (re)resumes the context.
  function start() {
    if (!enabled) return;
    if (!init()) return;
    unlockMedia();
    // iOS/Safari kickstart: play a 1-sample buffer inside the gesture.
    try { const bs = ctx.createBufferSource(); bs.buffer = ctx.createBuffer(1, 1, 22050); bs.connect(ctx.destination); bs.start(0); } catch (e) {}
    if (!started) {
      nextLoop = ctx.currentTime + 0.12;
      timer = setInterval(tick, 200);
      started = true;
    }
    if (ctx.state === "running") { announce(); tick(); }
    else ctx.resume().then(() => { nextLoop = ctx.currentTime + 0.12; announce(); tick(); }).catch(() => {});
    tick();
    updateBtn();
  }

  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
    if (ctx) ctx.suspend().catch(() => {});
    started = false;
    updateBtn();
  }

  // Tap the button to flip the preference: on -> start (create/resume the
  // context in this gesture), off -> stop.
  function toggle() {
    enabled = !enabled;
    try { localStorage.setItem("touch-music", enabled ? "on" : "off"); } catch (e) {}
    if (enabled) start(); else stop();
    updateBtn();
  }

  function updateBtn() {
    const b = document.getElementById("musicBtn");
    if (!b) return;
    b.innerHTML = (enabled ? "♫" : "♪") + (enabled ? " מוזיקה" : " מושתק"); // מוזיקה / מושתק
    b.style.opacity = enabled ? "1" : ".7";
  }

  return {
    start, stop, toggle, updateBtn, isRunning,
    isEnabled: () => enabled,
    isStarted: () => started,
  };
})();

/* ---------------- Boot ---------------- */
document.getElementById("newBtn").addEventListener("click", newGame);
document.getElementById("rulesBtn").addEventListener("click", showRules);
document.getElementById("endBtn").addEventListener("click", endTurn);
document.getElementById("undoBtn").addEventListener("click", undo);
document.getElementById("musicBtn").addEventListener("click", Music.toggle);
Music.updateBtn();

// Browsers block audio until a user gesture. Try to start on every early
// interaction and keep listening until the audio context is actually running
// (some browsers ignore the very first attempt).
const primeEvents = ["pointerdown", "touchend", "click", "keydown"];
function primeAudio(e) {
  if (e && e.target && e.target.id === "musicBtn") return; // the button controls itself
  Music.start();
  if (Music.isRunning()) primeEvents.forEach((e2) => window.removeEventListener(e2, primeAudio));
}
primeEvents.forEach((e) => window.addEventListener(e, primeAudio, { passive: true }));
// Resume when returning to the tab (mobile browsers suspend on background).
document.addEventListener("visibilitychange", () => { if (!document.hidden && Music.isEnabled()) Music.start(); });

function relayout() { fitLayout(); if (G) render(); }
window.addEventListener("resize", relayout);
window.addEventListener("orientationchange", () => setTimeout(relayout, 150));
if (window.visualViewport) window.visualViewport.addEventListener("resize", relayout);

fitLayout();
newGame();
// Show the rules once at first load.
showRules();

// Debug / test hook (safe to keep; used by headless tests).
window.__touch = {
  get state() { return G; },
  canFoundation, canTableau, doMove, drawCard, hasAnyMove,
  resolveSource, validTargets, snapshot, restore,
  columnOffset, fitLayout,
  newGame, hideModal, endTurn,
};
</script>
